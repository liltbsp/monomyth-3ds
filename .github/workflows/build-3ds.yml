name: Build 3DS

on:
  push:
    paths-ignore:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Allow git in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install optional 3DS libraries
        run: dkp-pacman -S --noconfirm --needed 3ds-zlib 3ds-libpng || true

      - name: Add bannertool shim (icon via devkitPro smdhtool)
        run: |
          mkdir -p /opt/shim
          cat > /opt/shim/bannertool <<'SHIM'
          #!/bin/bash
          # Minimal stand-in: only 'makesmdh' is needed for the .3dsx build.
          [ "$1" = "makesmdh" ] || { echo "shim: $1 not supported" >&2; exit 0; }
          shift
          while [ $# -gt 0 ]; do
            case "$1" in
              -s) S="$2"; shift 2;; -l) L="$2"; shift 2;; -p) P="$2"; shift 2;;
              -i) I="$2"; shift 2;; -o) O="$2"; shift 2;; *) shift;;
            esac
          done
          # Name shown in Azahar's game list, with the build number.
          S="Monomyth 3DS (build ${GITHUB_RUN_NUMBER:-dev})"
          L="mGBA with a Monomyth touch dock"
          exec /opt/devkitpro/tools/bin/smdhtool --create "$S" "$L" "$P" "$I" "$O"
          SHIM
          chmod +x /opt/shim/bannertool

      - name: Stamp build number
        run: |
          echo "#define MONOMYTH_BUILD \"${GITHUB_RUN_NUMBER}\"" > src/platform/3ds/build-stamp.h
          cat src/platform/3ds/build-stamp.h

      - name: Build mGBA for 3DS
        run: |
          export PATH=/opt/shim:$PATH
          mkdir -p build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=../src/platform/3ds/CMakeToolchain.txt -DCMAKE_BUILD_TYPE=Release -DBANNERTOOL=/opt/shim/bannertool
          make -j"$(nproc)" mgba.3dsx

      - name: Collect build output
        run: |
          mkdir -p out/3ds/monomyth-3ds
          # Unique file name per build, so an old copy can never be launched by mistake.
          find build -name 'mgba.3dsx' -exec cp {} "out/3ds/monomyth-3ds/monomyth3ds-b${GITHUB_RUN_NUMBER}.3dsx" \;
          echo "Monomyth 3DS build ${GITHUB_RUN_NUMBER}" > out/3ds/monomyth-3ds/BUILD.txt
          ls -la out/3ds/monomyth-3ds

      - uses: actions/upload-artifact@v4
        with:
          name: monomyth-3ds-b${{ github.run_number }}
          path: out/
