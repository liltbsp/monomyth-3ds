name: Build Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug -PbuildNumber=${{ github.run_number }} --no-daemon --stacktrace

      - name: Name the APK with its build number
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/DualDock-b${{ github.run_number }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: DualDock-b${{ github.run_number }}
          path: out/
